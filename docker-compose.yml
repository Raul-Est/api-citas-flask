services:
  api:
    build: .
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=Clinica
      - SECRET_KEY=misuperclavedeldestinofinal
      - JWT_SECRET_KEY=misuperclavedeldestinofinal
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - api-citas-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',5001)); s.close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - api-citas-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:latest
    ports:
      - "5001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - api-citas-network

networks:
  api-citas-network:
    driver: bridge

volumes:
  mongo-data:
